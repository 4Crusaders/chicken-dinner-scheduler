<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>BATTLEGROUNDS - 战术预定系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* ==================== GLOBAL RESET & VARIABLES ==================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        /* PUBG Color System */
        --pubg-orange: #F97316;
        --pubg-yellow: #FBBF24;
        --pubg-dark-bg: #0A0E13;
        --pubg-panel-bg: #1A1F2E;
        --pubg-border: #2D3748;
        --pubg-text: #E2E8F0;
        --pubg-text-muted: #94A3B8;
        --pubg-danger: #EF4444;
        --pubg-success: #10B981;

        /* Typography */
        --font-heading: 'Teko', sans-serif;
        --font-body: 'Rajdhani', sans-serif;

        /* Effects */
        --glow-orange: 0 0 20px rgba(249, 115, 22, 0.5), 0 0 40px rgba(249, 115, 22, 0.3);
        --glow-yellow: 0 0 20px rgba(251, 191, 36, 0.5), 0 0 40px rgba(251, 191, 36, 0.3);
        --metal-gradient: linear-gradient(135deg, #2D3748 0%, #1A202C 50%, #2D3748 100%);
      }

      /* ==================== BODY & BACKGROUND ==================== */
      body {
        background: var(--pubg-dark-bg);
        color: var(--pubg-text);
        font-family: var(--font-body);
        min-height: 100vh;
        padding: 15px;
        font-size: 16px;
        position: relative;
        overflow-x: hidden;
      }

      /* Tactical Grid Background */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          linear-gradient(rgba(249, 115, 22, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(249, 115, 22, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 0;
      }

      /* Scanline Effect */
      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          transparent 2px,
          transparent 4px
        );
        pointer-events: none;
        z-index: 9999;
        animation: scanline 8s linear infinite;
      }

      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(50px); }
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 10px;
        position: relative;
        z-index: 1;
      }

      /* ==================== HEADER ==================== */
      header {
        text-align: center;
        margin-bottom: 30px;
        padding: 30px 20px;
        background: var(--pubg-panel-bg);
        border-radius: 0;
        border: 2px solid var(--pubg-orange);
        box-shadow: var(--glow-orange), inset 0 0 30px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }

      header::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--pubg-yellow), transparent);
        animation: scan-horizontal 3s ease-in-out infinite;
      }

      @keyframes scan-horizontal {
        0%, 100% { left: -100%; }
        50% { left: 100%; }
      }

      h1 {
        font-family: var(--font-heading);
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--pubg-orange);
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 12px;
        text-shadow: var(--glow-orange);
        line-height: 1.1;
      }

      h1 i {
        color: var(--pubg-yellow);
        margin-right: 15px;
        font-size: 3rem;
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--pubg-text-muted);
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* ==================== MAIN LAYOUT ==================== */
      .app-container {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      @media (min-width: 1024px) {
        .app-container {
          flex-direction: row;
        }

        .booking-section {
          flex: 0 0 380px;
        }

        .board-section {
          flex: 1;
        }
      }

      /* ==================== CARD STYLES ==================== */
      .card {
        background: var(--pubg-panel-bg);
        border: 2px solid var(--pubg-border);
        padding: 25px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(249, 115, 22, 0.05);
        height: 100%;
        position: relative;
        transition: all 0.3s ease;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--pubg-orange), transparent);
        opacity: 0.7;
      }

      .card:hover {
        border-color: var(--pubg-orange);
        box-shadow: 0 10px 40px rgba(249, 115, 22, 0.3), inset 0 0 20px rgba(249, 115, 22, 0.1);
      }

      .section-title {
        font-family: var(--font-heading);
        font-size: 2rem;
        font-weight: 600;
        color: var(--pubg-yellow);
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--pubg-border);
        display: flex;
        align-items: center;
        gap: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .section-title i {
        color: var(--pubg-orange);
        font-size: 1.8rem;
      }

      /* ==================== FORM STYLES ==================== */
      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--pubg-yellow);
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      label i {
        color: var(--pubg-orange);
        margin-right: 8px;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid var(--pubg-border);
        background: rgba(0, 0, 0, 0.4);
        color: var(--pubg-text);
        font-size: 1rem;
        font-family: var(--font-body);
        font-weight: 500;
        transition: all 0.3s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--pubg-orange);
        background: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      /* ==================== TIME PICKER ==================== */
      .time-picker-container {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .time-select {
        flex: 1;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid var(--pubg-border);
        transition: all 0.3s;
      }

      .time-select:hover {
        border-color: var(--pubg-orange);
      }

      .time-separator {
        font-weight: 700;
        color: var(--pubg-orange);
        font-size: 1.2rem;
      }

      .time-validation {
        margin-top: 10px;
        font-size: 0.95rem;
        min-height: 24px;
        font-weight: 600;
      }

      /* ==================== BUTTONS ==================== */
      .btn-submit {
        background: linear-gradient(135deg, var(--pubg-orange) 0%, var(--pubg-yellow) 100%);
        color: #000;
        border: none;
        padding: 16px 24px;
        font-size: 1.2rem;
        font-family: var(--font-heading);
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.3s;
        margin-top: 15px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4);
      }

      .btn-submit::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(249, 115, 22, 0.6), var(--glow-orange);
      }

      .btn-submit:hover::before {
        width: 300px;
        height: 300px;
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* ==================== STATS ==================== */
      .stats {
        display: flex;
        justify-content: space-around;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 2px solid var(--pubg-border);
        flex-wrap: wrap;
        gap: 15px;
      }

      .stat-item {
        text-align: center;
        padding: 15px 20px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--pubg-border);
        border-radius: 0;
        min-width: 120px;
      }

      .stat-value {
        font-family: var(--font-heading);
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--pubg-orange);
        text-shadow: var(--glow-orange);
      }

      .stat-label {
        font-size: 0.9rem;
        color: var(--pubg-text-muted);
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* ==================== GANTT CHART ==================== */
      .gantt-chart {
        padding: 20px 0;
      }

      .gantt-scroll-container {
        overflow: visible;
      }

      .gantt-scroll-container::-webkit-scrollbar {
        height: 8px;
      }

      .gantt-scroll-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
      }

      .gantt-scroll-container::-webkit-scrollbar-thumb {
        background: var(--pubg-orange);
        border-radius: 0;
      }

      .timeline-header {
        display: flex;
        border-bottom: 2px solid var(--pubg-orange);
        margin-bottom: 20px;
        background: rgba(0, 0, 0, 0.3);
        flex-shrink: 0;
      }

      .timeline-hour {
        width: 35px;
        flex-shrink: 0;
        padding: 10px 4px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--pubg-yellow);
        border-left: 1px solid var(--pubg-border);
        border-right: 1px solid var(--pubg-border);
        text-align: center;
        font-family: var(--font-heading);
        letter-spacing: 1px;
      }

      .gantt-body {
        position: relative;
        min-height: 200px;
        padding-left: 0;
        flex-shrink: 0;
        padding-top: 80px; /* 为顶部tooltip留出空间 */
      }

      .gantt-bar {
        position: absolute;
        height: 45px;
        padding: 0 15px;
        display: flex;
        align-items: center;
        color: #000;
        font-weight: 700;
        font-size: 0.9rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);
        transition: all 0.3s;
        /* overflow: visible - 允许tooltip显示 */
        white-space: nowrap;
        border: 2px solid rgba(0, 0, 0, 0.3);
        font-family: var(--font-body);
        letter-spacing: 0.5px;
      }

      /* 内部文本溢出处理 */
      .gantt-bar-text,
      .gantt-bar-remark {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 移除 ::before 伪元素的shine效果，解决两侧阴影问题 */
      .gantt-bar::before {
        display: none;
      }

      /* Tooltip 必须放在 bar 外部才能显示 - 通过 JS 动态定位 */

      .gantt-bar:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), var(--glow-orange);
        z-index: 10;
      }

      .gantt-bar:hover::before {
        left: 100%;
      }

      .gantt-bar.own-booking {
        border: 3px solid var(--pubg-yellow);
        box-shadow: 0 4px 15px rgba(251, 191, 36, 0.5), var(--glow-yellow);
        cursor: pointer;
      }

      .gantt-bar.own-booking:hover {
        box-shadow: 0 8px 30px rgba(251, 191, 36, 0.7), var(--glow-yellow);
      }

      .gantt-bar-username {
        font-weight: 700;
        margin-right: 8px;
        flex-shrink: 0;
        text-transform: uppercase;
      }

      .gantt-bar-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--font-heading);
      }

      .gantt-bar-remark {
        margin-left: 10px;
        opacity: 0.8;
        font-size: 0.8rem;
        font-weight: 400;
      }

      /* ==================== COMPACT GANTT BAR ==================== */
      .gantt-bar-compact .gantt-bar-username {
        font-size: 1rem;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 50%;
        border: 2px solid var(--pubg-yellow);
        box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
      }

      /* ==================== TACTICAL TOOLTIP ==================== */
      .gantt-tooltip {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%) scale(0.9);
        background: var(--pubg-panel-bg);
        border: 2px solid var(--pubg-orange);
        padding: 12px 16px;
        border-radius: 0;
        box-shadow: var(--glow-orange), 0 10px 40px rgba(0, 0, 0, 0.8);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: none;
        z-index: 1000;
        min-width: 200px;
        white-space: nowrap;
        font-family: var(--font-body);
      }

      .gantt-tooltip::before {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: var(--pubg-orange);
      }

      .gantt-tooltip::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--pubg-yellow), transparent);
        background-size: 200% 100%;
        background-position: -150% 0;
        animation: scan-tooltip 2s ease-in-out infinite;
      }

      @keyframes scan-tooltip {
        0% {
          background-position: -150% 0;
          opacity: 0.6;
        }
        50% {
          background-position: 0% 0;
          opacity: 1;
        }
        100% {
          background-position: 150% 0;
          opacity: 0.6;
        }
      }

      .gantt-bar:hover .gantt-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) scale(1);
      }

      .gantt-tooltip-header {
        font-weight: 700;
        color: var(--pubg-yellow);
        margin-bottom: 8px;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .gantt-tooltip-header i,
      .gantt-tooltip-time i,
      .gantt-tooltip-remark i,
      .gantt-tooltip-action i {
        color: var(--pubg-orange);
        margin-right: 8px;
      }

      .gantt-tooltip-time {
        color: var(--pubg-text);
        margin-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .gantt-tooltip-remark {
        color: var(--pubg-text-muted);
        margin-bottom: 6px;
        font-size: 0.85rem;
        white-space: normal;
        max-width: 250px;
      }

      .gantt-tooltip-action {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--pubg-border);
        color: var(--pubg-danger);
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* ==================== EMPTY STATE ==================== */
      .empty-board {
        text-align: center;
        padding: 50px 20px;
        color: var(--pubg-text-muted);
      }

      .empty-board i {
        font-size: 4rem;
        margin-bottom: 20px;
        color: var(--pubg-border);
      }

      .empty-board h3 {
        font-family: var(--font-heading);
        font-size: 1.8rem;
        margin-bottom: 10px;
        color: var(--pubg-text);
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .empty-board p {
        font-size: 1rem;
      }

      /* ==================== LOGIN HINT ==================== */
      .login-hint {
        padding: 15px 20px;
        background: rgba(249, 115, 22, 0.1);
        border: 2px solid var(--pubg-orange);
        margin-bottom: 20px;
        text-align: center;
        color: var(--pubg-text);
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .login-hint a {
        color: var(--pubg-yellow);
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
      }

      .login-hint a:hover {
        text-decoration: underline;
        text-shadow: var(--glow-yellow);
      }

      /* ==================== NOTIFICATIONS ==================== */
      .notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 15px 20px;
        background: var(--pubg-success);
        color: #000;
        font-weight: 700;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5), var(--glow-orange);
        animation: slideIn 0.5s ease-out;
        z-index: 10000;
        font-size: 1rem;
        max-width: 90%;
        border: 2px solid rgba(0, 0, 0, 0.3);
        font-family: var(--font-body);
        letter-spacing: 0.5px;
      }

      .notification.error {
        background: var(--pubg-danger);
        box-shadow: 0 5px 20px rgba(239, 68, 68, 0.5);
      }

      .notification.warning {
        background: var(--pubg-yellow);
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* ==================== FOOTER ==================== */
      footer {
        text-align: center;
        margin-top: 40px;
        padding: 20px;
        color: var(--pubg-text-muted);
        font-size: 0.9rem;
        border-top: 1px solid var(--pubg-border);
        font-family: var(--font-heading);
        letter-spacing: 1px;
      }

      footer p {
        margin-bottom: 5px;
      }

      /* ==================== LOADING SPINNER ==================== */
      .loading {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid rgba(0, 0, 0, 0.3);
        border-top: 3px solid var(--pubg-yellow);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* ==================== RESPONSIVE DESIGN ==================== */
      @media (max-width: 1023px) {
        h1 {
          font-size: 2.5rem;
        }

        h1 i {
          font-size: 2rem;
        }

        .section-title {
          font-size: 1.6rem;
        }

        .time-picker-container {
          flex-direction: column;
        }

        .time-select {
          width: 100%;
        }
      }

      @media (max-width: 767px) {
        body {
          padding: 10px;
          font-size: 14px;
        }

        .container {
          padding: 5px;
        }

        .card {
          padding: 20px;
        }

        h1 {
          font-size: 2rem;
          letter-spacing: 2px;
        }

        .section-title {
          font-size: 1.4rem;
        }

        .timeline-hour {
          width: 42px;
          font-size: 0.7rem;
          padding: 8px 4px;
        }

        .gantt-bar {
          font-size: 0.8rem;
          padding: 0 10px;
          height: 38px;
        }

        .gantt-bar-username {
          margin-right: 5px;
        }

        .gantt-bar-remark {
          display: none;
        }

        /* 移动端 tooltip 优化 */
        .gantt-tooltip {
          min-width: 180px;
          font-size: 0.85rem;
          bottom: calc(100% + 8px);
        }

        .gantt-tooltip-header {
          font-size: 0.9rem;
        }

        .stat-value {
          font-size: 2rem;
        }
      }

      @media (max-width: 480px) {
        .gantt-chart {
          font-size: 0.7rem;
        }

        .gantt-bar {
          height: 32px;
          padding: 0 8px;
        }

        .gantt-bar-remark {
          display: none;
        }

        .gantt-bar-username {
          max-width: 60px;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* 超小屏幕 tooltip 简化 */
        .gantt-tooltip {
          min-width: 160px;
          padding: 10px 12px;
        }

        .gantt-tooltip-remark {
          max-width: 180px;
        }
      }

      /* ==================== REDUCED MOTION ==================== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        body::after {
          animation: none;
        }
      }

      /* ==================== CURSOR POINTER ==================== */
      button,
      a,
      .gantt-bar.own-booking,
      .session-option,
      .filter-btn,
      .clear-btn,
      select {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fas fa-crosshairs"></i> BATTLEGROUNDS</h1>
        <p class="subtitle">
          战术预定系统 | TACTICAL SCHEDULING SYSTEM
